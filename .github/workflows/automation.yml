name: Nepal Now Automation (News & Science)

on:
  schedule:
    # Science Fact Shorts (7:00 AM & 6:30 PM NPT)
    # 15 1 UTC = 7:00 AM NPT, 45 12 UTC = 6:30 PM NPT
    - cron: '15 1,12 * * *'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Select pipeline to run'
        required: true
        default: 'all'
        type: choice
        options:
          - science
          - science_long
      is_test:
        description: 'Run in test mode (no upload)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libsm6 libxext6
          pip install feedparser edge-tts "moviepy<2.0.0" requests beautifulsoup4 google-genai telethon python-dotenv duckduckgo-search google-api-python-client google-auth-oauthlib groq "Pillow<10.0.0" PyYAML elevenlabs          # Wav2Lip dependencies
          pip install torch torchvision librosa opencv-python numba tqdm requests
          
      - name: Configure ImageMagick
        run: |
          sudo sed -i 's/policy domain="path" rights="none" pattern="@\*"/policy domain="path" rights="read|write" pattern="@*"/g' /etc/ImageMagick-6/policy.xml

      - name: Create Storage Dirs
        run: mkdir -p automation/storage automation/logs Wav2Lip/checkpoints

      - name: Cache AI Models
        id: cache-ai-models
        uses: actions/cache@v3
        with:
          path: |
            Wav2Lip/checkpoints/
            Wav2Lip/face_detection/detection/sfd/
          key: ai-models-v2

      # --- PIPELINE ROUTING ---



      - name: Run Science Facts (Shorts)
        if: |
          github.event.schedule == '15 1,12 * * *' || 
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'science')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_SCIENCE }}
          ELEVENLAB_API_KEY: ${{ secrets.ELEVENLAB_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HUME_API_KEY: ${{ secrets.HUME_API_KEY }}
          HUME_API_KEY2: ${{ secrets.HUME_API_KEY2 }}
          HUME_API_KEY3: ${{ secrets.HUME_API_KEY3 }}
          HUME_API_KEY4: ${{ secrets.HUME_API_KEY4 }}
          HUME_API_KEY5: ${{ secrets.HUME_API_KEY5 }}
          HUME_VOICE_ID: ${{ secrets.HUME_VOICE_ID }}
          HUME_VOICE_ID_1: ${{ secrets.HUME_VOICE_ID_1 }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.is_test }}" == "true" ]; then FLAGS="--test"; fi
          python automation/main.py --config automation/config/science.yaml --mode shorts $FLAGS

      - name: Run Science Detailed (Long Form)
        if: |
          github.event.schedule == '15 1,12 * * *' || 
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'science_long')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_SCIENCE }}
          ELEVENLAB_API_KEY: ${{ secrets.ELEVENLAB_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HUME_API_KEY: ${{ secrets.HUME_API_KEY }}
          HUME_API_KEY2: ${{ secrets.HUME_API_KEY2 }}
          HUME_API_KEY3: ${{ secrets.HUME_API_KEY3 }}
          HUME_API_KEY4: ${{ secrets.HUME_API_KEY4 }}
          HUME_API_KEY5: ${{ secrets.HUME_API_KEY5 }}
          HUME_VOICE_ID: ${{ secrets.HUME_VOICE_ID }}
          HUME_VOICE_ID_1: ${{ secrets.HUME_VOICE_ID_1 }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.is_test }}" == "true" ]; then FLAGS="--test"; fi
          python automation/main.py --config automation/config/science.yaml --mode daily $FLAGS

      - name: Commit State Changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add automation/storage/*.json
          git commit -m "Update automation state" || echo "No changes to commit"
          
          # Robust merge for state files
          MAX_RETRIES=5
          RETRY_COUNT=0
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            git pull --rebase origin main && break
            echo "Merge conflict detected, attempting automated JSON merge..."
            git rebase --abort || true
            git fetch origin main
            
            # Use python for union merge
            python -c "import json, os, subprocess; [ ( (lambda f: ( (lambda d1, d2: open(f, 'w').write(json.dumps(list(set(d1)|set(d2))))) (json.load(open(f)), json.loads(subprocess.check_output(['git', 'show', 'origin/main:'+f]).decode())) ) (f) ) if os.path.exists(f) else None ) for f in ['automation/storage/posted_science.json'] ]"
            
            git add automation/storage/*.json
            git commit -m 'Update state (merged)' || echo 'Nothing to commit after merge'
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          git push origin main || echo "Push failed after retries"
